name: EduManage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Node.js Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wd

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
